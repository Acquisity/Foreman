name: widget-guide

on:
  repository_dispatch:
    types: [docs-changed]
  workflow_dispatch:
    inputs:
      sha:
        description: Acquisity commit or ref (default main)
        required: false
      allow_other_ref:
        description: Explicitly allow a manual source outside Acquisity main history
        type: boolean
        default: false
      full:
        description: Regenerate every section, ignoring the stored outputs
        type: boolean
        default: false

permissions: {}

concurrency:
  group: widget-guide
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  regenerate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHA: ${{ github.event.client_payload.sha || inputs.sha || 'main' }}
      EVENT: ${{ github.event_name }}
      ALLOW_OTHER_REF: ${{ inputs.allow_other_ref || false }}
      FULL: ${{ inputs.full && '--full' || '' }}
    steps:
      - name: Check the requested source
        run: |
          if [[ "$EVENT" == repository_dispatch ]]; then
            [[ "$SHA" =~ ^[0-9a-f]{7,40}$ ]] || { echo "Dispatch requires a commit SHA" >&2; exit 1; }
          elif [[ "$ALLOW_OTHER_REF" != true ]]; then
            [[ "$SHA" =~ ^([0-9a-f]{7,40}|main)$ ]] || { echo "Other refs require allow_other_ref" >&2; exit 1; }
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Acquisity/Acquisity
          ref: ${{ env.SHA }}
          path: acquisity
          token: ${{ secrets.WIDGET_GUIDE_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify source history
        run: |
          if [[ "$EVENT" == repository_dispatch || "$ALLOW_OTHER_REF" != true ]]; then
            git -C acquisity merge-base --is-ancestor HEAD origin/main
          fi
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Load pending guide cache as data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git_read() { git -c credential.helper= -c 'credential.helper=!gh auth git-credential' "$@"; }
          status=0
          git_read ls-remote --exit-code --heads origin refs/heads/bot/widget-guide > "$RUNNER_TEMP/bot-ref" || status=$?
          if [[ "$status" == 0 ]]; then
            git_read fetch --no-tags origin refs/heads/bot/widget-guide:refs/remotes/origin/bot/widget-guide
            git show origin/bot/widget-guide:scripts/widget-product-guide.cache.json > scripts/widget-product-guide.cache.json
            cp scripts/widget-product-guide.cache.json "$RUNNER_TEMP/bot-cache.json"
            git show origin/bot/widget-guide:agent/lib/widget-product-guide.ts > "$RUNNER_TEMP/bot-guide.ts"
          elif [[ "$status" != 2 ]]; then
            exit "$status"
          fi
          pnpm exec tsx --eval 'import { readFileSync } from "node:fs"; import { parseGuideCache } from "./agent/lib/widget-guide-cache.ts"; const cache = parseGuideCache(readFileSync("scripts/widget-product-guide.cache.json", "utf8")); console.log(Object.keys(cache).length === 0 ? "First run: full bootstrap regenerates every section." : "Loaded validated guide cache.");'
      - name: Regenerate the guide
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          CLIPROXY_BASE_URL: ${{ secrets.CLIPROXY_BASE_URL }}
          CLIPROXY_API_KEY: ${{ secrets.CLIPROXY_API_KEY }}
        run: pnpm widget:guide --repo acquisity --ref HEAD $FULL | tee "$RUNNER_TEMP/guide.log"
      - name: Open or update the PR
        env:
          GH_TOKEN: ${{ secrets.WIDGET_GUIDE_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ -f "$RUNNER_TEMP/bot-guide.ts" ]]; then
            unchanged=$(pnpm exec tsx --eval 'import { readFileSync } from "node:fs"; import { guideArtifactsEqual } from "./agent/lib/widget-guide-cache.ts"; const before = { guide: readFileSync(`${process.env.RUNNER_TEMP}/bot-guide.ts`, "utf8"), cache: readFileSync(`${process.env.RUNNER_TEMP}/bot-cache.json`, "utf8") }; const after = { guide: readFileSync("agent/lib/widget-product-guide.ts", "utf8"), cache: readFileSync("scripts/widget-product-guide.cache.json", "utf8") }; console.log(guideArtifactsEqual(before, after));')
            if [[ "$unchanged" == true ]]; then
              echo "Pending guide and cache unchanged; no commit or push."
              exit 0
            fi
          fi
          if git diff --quiet -- agent/lib/widget-product-guide.ts scripts/widget-product-guide.cache.json; then
            echo "Guide and cache unchanged; no PR."
            exit 0
          fi
          commit=$(git -C acquisity rev-parse HEAD)
          changed=$(grep -m1 '^regenerated=' "$RUNNER_TEMP/guide.log" | cut -d= -f2- | sed 's/,/, /g')
          calls=$(grep -o 'successful_calls=[0-9]*' "$RUNNER_TEMP/guide.log" | tail -1 | cut -d= -f2)
          attempts=$(grep -o 'attempts=[0-9]*' "$RUNNER_TEMP/guide.log" | tail -1 | cut -d= -f2)
          cost=$(grep -o 'reported_cost=\$[0-9.]*' "$RUNNER_TEMP/guide.log" | tail -1 | cut -d= -f2)
          unpriced=$(grep -o 'unpriced_calls=[0-9]*' "$RUNNER_TEMP/guide.log" | tail -1 | cut -d= -f2)
          title="chore(widget): regenerate the product guide from Acquisity ${commit:0:12}"
          git config user.name "foreman-widget-guide"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c bot/widget-guide
          git commit -m "$title" -- agent/lib/widget-product-guide.ts scripts/widget-product-guide.cache.json
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push --force-with-lease origin bot/widget-guide
          cat > "$RUNNER_TEMP/body.md" <<EOF_BODY
          Regenerated from Acquisity [${commit:0:12}](https://github.com/Acquisity/Acquisity/commit/$commit) by [this run]($RUN_URL).

          Regenerated sections: $changed

          Reported cost: $cost for gateway calls only ($unpriced CLI Proxy calls report no cost) over $calls successful responses and $attempts model attempts. Failed requests may have incurred additional cost.

          The first automated run regenerates every section; later runs reuse the JSON cache, including outputs in the pending bot PR.

          If this change touched the sidebar catalog or apps/web/lib/features.ts, check the hardcoded facts at the top of scripts/widget-product-guide.ts (AVAILABILITY, ENTRY_POINTS) in the app; this workflow cannot verify them.

          Review and merge by hand; nothing merges this automatically.
          EOF_BODY
          number=$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=$GITHUB_REPOSITORY_OWNER:bot/widget-guide&state=open" --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$number" -f title="$title" -F body=@"$RUNNER_TEMP/body.md" --jq .html_url
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/pulls" -f title="$title" -f head=bot/widget-guide -f base=main -F body=@"$RUNNER_TEMP/body.md" --jq .html_url
          fi
