name: validate

on:
  pull_request:
    branches: [main]

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Connector UIDs are identifiers, not credentials. `eve info` refuses to
    # evaluate the tool files that read them when they are unset, so discovery
    # needs a value for each one. Placeholders are enough: discovery never
    # contacts a connector. Never put a secret here.
    env:
      EXECUTOR_MCP_CONNECTOR: placeholder/foreman-ci
      LINEAR_CONNECTOR: placeholder/foreman-ci
      SUPERMEMORY_MCP_CONNECTOR: placeholder/foreman-ci
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
