name: widget-tools

# Regenerates the widget's support endpoint tools (ENG-20296) from Acquisity's
# endpoint manifest at the commit Acquisity's support-endpoints-trigger sends,
# with no model, onto bot/widget-tools, and files the Fixy ticket that reviews
# and merges it (ENG-20297).

on:
  repository_dispatch:
    types: [support-endpoints-changed]
  workflow_dispatch:
    inputs:
      sha:
        description: Acquisity commit (default main)
        required: false

permissions: {}

concurrency:
  group: widget-tools
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  regenerate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHA: ${{ github.event.client_payload.sha || inputs.sha || 'main' }}
      EVENT: ${{ github.event_name }}
    steps:
      - name: Check the requested source
        run: |
          if [[ "$EVENT" == repository_dispatch ]]; then
            [[ "$SHA" =~ ^[0-9a-f]{7,40}$ ]] || { echo "Dispatch requires a commit SHA" >&2; exit 1; }
          else
            [[ "$SHA" =~ ^([0-9a-f]{7,40}|main)$ ]] || { echo "Use a commit SHA or main" >&2; exit 1; }
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Acquisity/Acquisity
          ref: ${{ env.SHA }}
          path: acquisity
          token: ${{ secrets.WIDGET_GUIDE_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify source history
        run: git -C acquisity merge-base --is-ancestor HEAD origin/main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Install scripts stay off: the manifest needs only Acquisity's sources and their packages.
      - name: Read the manifest at that commit
        working-directory: acquisity
        env:
          HUSKY: '0'
        run: |
          bun install --frozen-lockfile --ignore-scripts
          node apps/web/scripts/print-foreman-manifest.mjs > "$RUNNER_TEMP/manifest.json"
      - name: Regenerate the tools
        run: pnpm widget:tools --manifest "$RUNNER_TEMP/manifest.json" --commit "$(git -C acquisity rev-parse HEAD)"
      - name: Open or update the PR
        env:
          GH_TOKEN: ${{ secrets.WIDGET_GUIDE_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          file=agent/lib/widget-endpoint-manifest.ts
          git_auth() { git -c credential.helper= -c 'credential.helper=!gh auth git-credential' "$@"; }
          status=0
          git_auth ls-remote --exit-code --heads origin refs/heads/bot/widget-tools > /dev/null || status=$?
          if [[ "$status" == 0 ]]; then
            git_auth fetch --no-tags origin refs/heads/bot/widget-tools:refs/remotes/origin/bot/widget-tools
            if git show origin/bot/widget-tools:"$file" | diff -q - "$file" > /dev/null; then
              echo "Pending tools PR already has this manifest; no commit or push."
              exit 0
            fi
          elif [[ "$status" != 2 ]]; then
            exit "$status"
          fi
          if git diff --quiet -- "$file"; then
            echo "Manifest unchanged; no PR."
            exit 0
          fi
          commit=$(git -C acquisity rev-parse HEAD)
          title="chore(widget): regenerate the support endpoint tools from Acquisity ${commit:0:12}"
          git config user.name "foreman-widget-tools"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c bot/widget-tools
          git commit -m "$title" -- "$file"
          git_auth push --force-with-lease origin bot/widget-tools
          cat > "$RUNNER_TEMP/body.md" <<EOF_BODY
          Regenerated from Acquisity [${commit:0:12}](https://github.com/Acquisity/Acquisity/commit/$commit) by [this run]($RUN_URL), with no model: \`$file\` is Acquisity's \`serializeForemanManifest()\` at that commit.

          Fixy reviews this PR and merges it once the review-bot loop clears, from the fixy-labelled Linear ticket the next step files: CI passes, and the diff removes or renames no tool, input, section or status value unless the manifest adds the change as a new endpoint version and keeps the old one live.
          EOF_BODY
          number=$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=$GITHUB_REPOSITORY_OWNER:bot/widget-tools&state=open" --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$number" -f title="$title" -F body=@"$RUNNER_TEMP/body.md" --jq .html_url
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/pulls" -f title="$title" -f head=bot/widget-tools -f base=main -F body=@"$RUNNER_TEMP/body.md" --jq .html_url
          fi
      # Runs on every pass, unchanged ones too, so an open tools PR always has its Fixy ticket.
      - name: File or reuse the Fixy ticket
        env:
          GH_TOKEN: ${{ secrets.WIDGET_GUIDE_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          url=$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=$GITHUB_REPOSITORY_OWNER:bot/widget-tools&state=open" --jq '.[0].html_url // empty')
          if [[ -z "$url" ]]; then
            echo "No open tools PR; no ticket."
            exit 0
          fi
          pnpm exec tsx scripts/generated-pr-ticket.ts --kind tools --pr "$url"
